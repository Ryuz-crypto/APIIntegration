name: ec-mcp
on:
  push:
    paths:
      - "ec-mcp/**"
      - ".github/workflows/ec-mcp.yml"
      - "README.md"
  pull_request:
    paths:
      - "ec-mcp/**"
      - ".github/workflows/ec-mcp.yml"
      - "README.md"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ec-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -r requirements-stable.txt -e .
      - name: Verify stable package identity
        run: |
          python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          from packaging.version import Version
          from ec_mcp import __version__
          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("ec-mcp") == __version__ == declared
          assert not Version(declared).is_prerelease and not Version(declared).is_devrelease
          PY
      - name: Lint (ruff)
        run: |
          ruff check ec_mcp tests scripts/apply-web-update.py
      - name: Security lint (bandit)
        run: |
          bandit -r ec_mcp scripts/apply-web-update.py -q
      - name: Run tests
        run: python -m pytest tests -q
      - name: Smoke test MCP stdio
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' | timeout 30 ec-mcp | grep -c '"id"'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.24.3
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }} -1"
          fi
          /tmp/gitleaks git . --redact --no-banner --config .gitleaks.toml --log-opts="$RANGE"

  audit-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ec-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and audit dependencies
        run: |
          pip install -r requirements-stable.txt -e . pip-audit
          pip-audit --skip-editable
