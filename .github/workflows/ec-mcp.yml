name: ec-mcp
on:
  push:
    paths:
      - "ec-mcp/**"
  pull_request:
    paths:
      - "ec-mcp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ec-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e . pytest pytest-asyncio
      - name: Verify beta package identity
        run: python -c "from ec_mcp import __version__; assert __version__ == \"2.0.0b1\""\n      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ec_mcp tests
      - name: Security lint (bandit)
        run: |
          pip install bandit
          bandit -r ec_mcp -q
      - name: Run tests
        run: python -m pytest tests -q
      - name: Smoke test MCP stdio
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' | timeout 30 ec-mcp | grep -c '"id"'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.24.3
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose --config .gitleaks.toml

  audit-deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ec-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and audit dependencies
        run: |
          pip install -e . pip-audit
          pip-audit --skip-editable
