name: DashboardAPI-EC

on:
  push:
    branches: [main]
    paths: ["DashboardAPI-EC/**", ".github/workflows/dashboardapi-ec.yml"]
  pull_request:
    paths: ["DashboardAPI-EC/**", ".github/workflows/dashboardapi-ec.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DashboardAPI-EC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend
        run: |
          python -m pip install -e "backend[dev]"
          cd backend
          ruff check app tests
          pytest -q
      - name: Frontend
        run: |
          cd frontend
          npm install
          npm run build

  package:
    runs-on: ubuntu-24.04
    needs: validate
    defaults:
      run:
        working-directory: DashboardAPI-EC
    steps:
      - uses: actions/checkout@v4
      - name: Install package build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev python3-pip python3-venv nodejs npm
      - name: Build deb
        run: ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dashboardapi-ec-1.0.0-deb
          path: DashboardAPI-EC/dist/*.deb
          if-no-files-found: error
