[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-mcp"
version = "9.3.0"
description = "MCP server for HPE Aruba EdgeConnect SD-WAN (Orchestrator REST + ECOS SSH)"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.2",
  "httpx>=0.27",
  "netmiko>=4.3",
  "paramiko>=3.4",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
  "starlette>=0.38",
]

[project.scripts]
ec-mcp = "ec_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["ec_mcp*"]

[tool.setuptools.package-data]
ec_mcp = ["profiles/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
  "BLE001",
  "S104",
  "E501",
  "E402",
  "S105",
  "S108",
  "S110",
  "S310",
  "S112",
  "TRY004",
  "PLW0602",
  "SIM102",
  "ASYNC251",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
# el template HTML/JS de la UI contiene texto i18n (JA/DE) con paréntesis fullwidth y guiones
"ec_mcp/admin_page.py" = ["RUF001"]
