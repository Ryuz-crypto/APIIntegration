# Reverse proxy con TLS para ec-mcp.
# El MCP siempre escucha en 127.0.0.1; esta configuración lo publica por HTTPS
# (directamente o detrás de tu plataforma ZTNA) con streaming habilitado.
# Publicado en el puerto 10001: https://TU-DOMINIO:10001/mcp

server {
    listen 10001 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # Los clientes MCP usan POST con respuestas JSON o text/event-stream.
    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Streaming: no буferizar respuestas SSE/chunked
        proxy_buffering off;
        proxy_cache off;

        # Sesiones MCP de larga duración
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check público para balanceadores / ZTNA
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}
