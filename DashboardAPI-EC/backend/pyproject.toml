[project]
name = "dashboardapi-ec-backend"
version = "1.0.0"
description = "EdgeConnect API-driven NOC dashboard"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "celery==5.6.2",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "redis>=5.0.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.compatibility" = ["profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "TRY004"]
